# Current version assumption: clang-15/16/17.

# This is for LSAN (leak sanitizer), not ASAN proper; ASAN runs include LSAN, wired via LSAN_OPTIONS.
# (See src/sanitize/asan/ counterpart and the workflow file for more on that arrangement.)

# glibc allocates a small registration node per (thread, `thread_local` object with destructor), inside
# __cxa_thread_atexit_impl(), the first time the thread constructs such an object.  If a thread terminates
# without its thread_local-destructor phase running -- which is exactly the documented behavior when the
# *process* exit()s (as opposed to a non-main thread exiting normally) -- the node remains allocated and
# unreachable, and LSAN reports it.  This can only ever match those glibc-internal nodes, whose count is
# bounded (once per thread x thread_local), so the suppression cannot mask an unbounded/real leak.
# In this test binary the report otherwise appears (a) at normal end-of-suite process exit and (b) inside the
# Thread_local_ptr.Exit_skips_cleanup death-test child, whose very purpose is to verify the
# cleanups-skipped-at-exit() contract (see that test).
leak:__cxa_thread_atexit_impl
